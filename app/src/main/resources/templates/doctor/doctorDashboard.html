<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Favicon link -->
    <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}" />
    
    <title>Doctor Dashboard</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/doctorDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">

    <!-- Scripts (Utility and Components) -->
    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>
    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>
    <script th:src="@{/js/components/patientRows.js}" defer></script>
    
    <!-- Services and Main Logic -->
    <script th:src="@{/js/services/patientServices.js}" defer></script>
    <script type="module" th:src="@{/js/doctorDashboard.js}" defer></script>
</head>
<body onload="renderContent()">
    <div class="container">
        <div class="wrapper">
            <!-- Header Placeholder -->
            <div id="header"></div>

            <!-- Main Content Area -->
            <main class="main-content">
                <h2>Doctor Dashboard</h2>

                <div class="controls-section">
                    <!-- Search Bar -->
                    <div class="search-container">
                        <input type="text" id="searchBar" class="searchBar" placeholder="Search patients by name or ID..." onkeyup="filterPatients()" />
                    </div>

                    <!-- Filter Controls -->
                    <div class="filters">
                        <button id="todayButton" class="filter-btn" onclick="showTodayAppointments()">Today's Appointments</button>
                        <div class="date-filter">
                            <label for="datePicker">Filter by Date:</label>
                            <input type="date" id="datePicker" onchange="filterByDate()" />
                        </div>
                    </div>
                </div>

                <!-- Patient Records Table -->
                <div class="table-container">
                    <table id="patientTable">
                        <thead>
                            <tr>
                                <th>Patient ID</th>
                                <th>Name</th>
                                <th>Phone No.</th>
                                <th>Email</th>
                                <th>Prescription</th>
                            </tr>
                        </thead>
                        <tbody id="patientTableBody">
                            <!-- Dynamic patient rows will be injected here -->
                        </tbody>
                    </table>
                </div>
            </main>

            <!-- Footer Placeholder -->
            <div id="footer"></div>
        </div>
    </div>
</body>
</html>
