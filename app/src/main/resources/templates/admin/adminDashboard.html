<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    
    <!-- CSS links for page-specific and global styles -->
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">

    <!-- JavaScript files with defer (Utility and Layout components) -->
    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>
    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>
</head>
<body onload="renderContent()">
    <div class="container">
        <div class="wrapper">
            <!-- Dynamic Header placeholder -->
            <div id="header"></div>

            <main class="main-content">
                <!-- Search bar -->
                <input type="text" id="searchBar" placeholder="search by doctor name" />

                <!-- Filter section -->
                <div class="filters">
                    <select id="filterTime">
                        <option value="">Sort by time</option>
                        <option value="AM">Morning (AM)</option>
                        <option value="PM">Afternoon (PM)</option>
                    </select>

                    <select id="filterSpecialty">
                        <option value="">Filter by specialty</option>
                        <option value="Cardiologist">Cardiologist</option>
                        <option value="Dentist">Dentist</option>
                        <option value="Pediatrician">Pediatrician</option>
                        <option value="Neurologist">Neurologist</option>
                        <option value="General Physician">General Physician</option>
                    </select>
                    
                    <!-- Added Add Doctor button that matches adminDashboard.js id -->
                    <button id="addDocBtn" class="dashboard-btn">Add Doctor</button>
                </div>

                <!-- Dynamic list of doctors -->
                <div id="content"></div>
            </main>

            <!-- Dynamic Footer placeholder -->
            <div id="footer"></div>
        </div>
    </div>

    <!-- Hidden Modal for Adding/Editing Doctor -->
    <div id="modal" class="modal" style="display: none;">
        <div class="modal-content">
            <button id="closeModal">Close</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Service scripts for admin dashboard and doctorCard -->
    <script type="module" th:src="@{/js/adminDashboard.js}" defer></script>
    <script type="module" th:src="@{/js/components/doctorCard.js}" defer></script>
</body>
</html>
