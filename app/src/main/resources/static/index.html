<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Clinic - Select Your Role</title>
    
    <!-- Favicon -->
    <link rel="icon" href="./assets/images/favicon.ico" type="image/x-icon">

    <!-- CSS Links -->
    <link rel="stylesheet" href="./assets/css/index.css">
    <link rel="stylesheet" href="./assets/css/style.css">

    <!-- JS Utility Links -->
    <script src="./js/util.js" defer></script>
    <script src="./js/render.js" defer></script>

    <!-- JS Component Links -->
    <script src="./js/components/header.js" defer></script>
    <script src="./js/components/footer.js" defer></script>
</head>
<body>
    <main>
        <div class="container">
            <div class="wrapper">
                <!-- Placeholder for Header -->
                <div id="header"></div>

                <main class="main-content">
                    <h2 id="roleHeader">Select Your Role</h2>
                    <div class="role-selection">
                        <button id="adminBtn" onclick="openModal('adminLogin')">Admin</button>
                        <button id="doctorBtn" onclick="openModal('doctorLogin')">Doctor</button>
                        <button id="patientBtn" onclick="selectRole('patient')">Patient</button>
                    </div>
                </main>

                <!-- Placeholder for Footer -->
                <div id="footer"></div>
            </div>
        </div>
    </main>

    <!-- Hidden Modal -->
    <div id="modal" class="modal" style="display: none;">
        <div class="modal-content">
            <button id="closeModal">Close</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Main Service Script -->
    <script type="module" src="./js/services/index.js" defer></script>
</body>
</html>
